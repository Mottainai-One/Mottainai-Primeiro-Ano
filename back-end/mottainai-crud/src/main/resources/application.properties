spring.profiles.default=dev
spring.config.import=optional:file:./config/local.properties
spring.application.name=mottainai-crud
server.port=${PORT:8080}

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

mottainai.crypto.key=${MOTTAINAI_AES_KEY:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=${SHOW_SQL:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mottainai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
