plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mottainai'
version = '0.0.1-SNAPSHOT'
description = 'mottainai-crud'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.security:spring-security-crypto'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'

    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PostgreSQL temporário nos testes; não conecta à Aiven e não precisa de Docker.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
}

tasks.named('test') {
    dependsOn tasks.named('bootWar')
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
    systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('test-temp').get().asFile.absolutePath
    doFirst { layout.buildDirectory.dir('test-temp').get().asFile.mkdirs() }
}

tasks.register('gerarCarga', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mottainai.mottainaicrud.util.DataLoadGenerator'
    workingDir = projectDir
}

tasks.named('bootRun') {
    workingDir = projectDir
}
